name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # build มีขั้น prerender ที่ต้องใช้ headless Chromium ของ Playwright
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Public, synthetic fixture only. No production Supabase credentials.
        env:
          VITE_SUPABASE_URL: https://ad-boundary-test.supabase.co
          VITE_SUPABASE_ANON_KEY: public-test-placeholder
        run: npm run build

      - name: Test network-blocked advertising privacy boundary
        run: node scripts/test-ad-boundary.mjs

      - name: Test network-blocked purchase receipt boundary
        run: node scripts/test-purchase-receipt.mjs

      - name: Test network-blocked entitlement integration
        run: node scripts/test-entitlement-boundary.mjs

