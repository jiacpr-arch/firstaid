<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" fill="none">
  <!-- Jia Training Center — FirstAid (vector stand-in; replace with official PNG if desired) -->
  <defs>
    <linearGradient id="jiaRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E63329"/>
      <stop offset="1" stop-color="#C8102E"/>
    </linearGradient>
  </defs>

  <!-- Shield -->
  <path d="M160 18 L286 60 V176 C286 252 232 300 160 332 C88 300 34 252 34 176 V60 Z"
        fill="#FFFFFF" stroke="#1B3A6B" stroke-width="11" stroke-linejoin="round"/>
  <path d="M160 40 L266 75 V176 C266 240 222 282 160 310 C98 282 54 240 54 176 V75 Z"
        fill="none" stroke="#1B3A6B" stroke-width="4" stroke-linejoin="round" opacity="0.55"/>

  <!-- Red medical cross -->
  <path d="M132 96 H188 V132 H224 V188 H188 V224 H132 V188 H96 V132 H132 Z"
        fill="url(#jiaRed)"/>

  <!-- Stylized white 'j' figure (head + stem) -->
  <circle cx="172" cy="118" r="15" fill="#FFFFFF"/>
  <path d="M178 138 V196 C178 214 164 226 146 224 C134 222 126 213 124 201"
        fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>

  <!-- Red cupping hand / swoosh -->
  <path d="M96 214 C120 246 168 252 206 232 C238 215 252 196 256 178
           C246 214 214 244 170 248 C140 251 112 240 96 214 Z"
        fill="url(#jiaRed)" opacity="0.92"/>

  <!-- Wordmark -->
  <text x="120" y="352" font-family="'Noto Sans Thai',Arial,sans-serif" font-size="46"
        font-weight="800" fill="#1B3A6B" text-anchor="end" letter-spacing="-1">jia</text>
  <text x="128" y="343" font-family="'Noto Sans Thai',Arial,sans-serif" font-size="22"
        font-weight="800" fill="#1B3A6B" letter-spacing="1">TRAINING</text>
  <text x="128" y="365" font-family="'Noto Sans Thai',Arial,sans-serif" font-size="22"
        font-weight="800" fill="#C8102E" letter-spacing="3">CENTER</text>

  <!-- Heartbeat baseline + FIRSTAID -->
  <path d="M120 374 H196 l6 -8 5 14 6 -6 H252" stroke="#C8102E" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
  <text x="186" y="392" font-family="'Noto Sans Thai',Arial,sans-serif" font-size="13"
        font-weight="700" fill="#1B3A6B" text-anchor="middle" letter-spacing="6">+  FIRSTAID  +</text>
</svg>
